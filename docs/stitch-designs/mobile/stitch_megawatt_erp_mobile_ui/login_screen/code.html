<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-start overflow-x-hidden">
<!-- Background Decoration -->
<div class="fixed inset-0 industrial-pattern z-0 pointer-events-none"></div>
<div class="circuit-line top-1/4"></div>
<div class="circuit-line top-3/4"></div>
<!-- Main Container -->
<main class="relative z-10 w-full max-w-[430px] px-margin-mobile flex flex-col min-h-screen pt-12 pb-8">
<!-- Language Switcher & Header -->
<header class="flex justify-between items-center mb-12">
<div class="flex items-center gap-2">
<div class="w-10 h-10 bg-primary-container flex items-center justify-center rounded-lg shadow-sm">
<span class="material-symbols-outlined text-on-primary-fixed-variant" style="font-variation-settings: 'FILL' 1;">bolt</span>
</div>
<div class="flex flex-col">
<h1 class="font-headline-md text-headline-md text-primary leading-tight">MegaWatt ERP</h1>
<h2 class="font-headline-sm text-headline-sm text-primary opacity-80 leading-tight" dir="rtl">ميجا وات ERP</h2>
</div>
</div>
<button class="flex items-center gap-1 bg-surface-container-high px-3 py-1.5 rounded-full border border-outline-variant hover:bg-surface-container-highest transition-colors" id="langToggle">
<span class="material-symbols-outlined text-[18px]">language</span>
<span class="font-label-bold text-label-bold">AR/EN</span>
</button>
</header>
<!-- Login Form Card -->
<section class="bg-surface-container-lowest border border-outline-variant rounded-xl p-6 shadow-sm mb-8">
<h3 class="font-headline-sm text-headline-sm text-on-surface mb-6">Log in to your workspace</h3>
<form class="space-y-6">
<!-- Email Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-bold text-label-bold text-on-surface-variant flex justify-between">
                        EMAIL ADDRESS
                        <span class="material-symbols-outlined text-[16px]">alternate_email</span>
</label>
<div class="relative">
<input class="w-full h-12 px-4 bg-surface-bright border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all font-body-md text-body-md" placeholder="name@factory.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-bold text-label-bold text-on-surface-variant flex justify-between">
                        PASSWORD
                        <span class="material-symbols-outlined text-[16px]">lock</span>
</label>
<div class="relative">
<input class="w-full h-12 px-4 bg-surface-bright border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all font-body-md text-body-md" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-primary" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
<a class="text-right font-label-bold text-label-bold text-primary mt-1 hover:underline" href="#">Forgot password?</a>
</div>
<!-- Login Button -->
<button class="w-full h-[48px] bg-primary text-on-primary rounded-lg font-headline-sm text-headline-sm flex items-center justify-center gap-2 active:scale-[0.98] transition-transform shadow-md" type="submit">
                    Login
                    <span class="material-symbols-outlined">login</span>
</button>
</form>
</section>
<!-- Quick Demo Login -->
<section class="mb-auto">
<div class="flex items-center gap-3 mb-4">
<div class="h-px flex-1 bg-outline-variant"></div>
<span class="font-label-bold text-label-bold text-outline uppercase tracking-widest">Quick Demo Access</span>
<div class="h-px flex-1 bg-outline-variant"></div>
</div>
<div class="grid grid-cols-2 gap-3">

</button>
<button class="demo-chip group flex items-center gap-2 p-3 bg-surface-container rounded-lg border border-outline-variant hover:border-primary hover:bg-primary-fixed transition-all" onclick="fillDemo('Sales')">

<span class="material-symbols-outlined text-primary text-[20px]">payments</span>
</div>
<span class="font-label-bold text-label-bold text-on-surface-variant group-hover:text-primary">Sales</span>
</button>
<button class="demo-chip group flex items-center gap-2 p-3 bg-surface-container rounded-lg border border-outline-variant hover:border-primary hover:bg-primary-fixed transition-all" onclick="fillDemo('Accountant')">

<span class="font-label-bold text-label-bold text-on-surface-variant group-hover:text-primary">Accountant</span>

<div class="w-8 h-8 rounded bg-surface-container-highest flex items-center justify-center group-hover:bg-white">
<span class="material-symbols-outlined text-primary text-[20px]">inventory_2</span>
</div>
<span class="font-label-bold text-label-bold text-on-surface-variant group-hover:text-primary">Warehouse</span>
</button>
</div>
</section>

</div>
<script>
        // Language Toggle Logic
        const langToggle = document.getElementById('langToggle');
        let currentLang = 'EN';
        
        langToggle.addEventListener('click', () => {
            currentLang = currentLang === 'EN' ? 'AR' : 'EN';
            document.body.dir = currentLang === 'AR' ? 'rtl' : 'ltr';
            
            // Basic UI string swap example
            const loginTitle = document.querySelector('h3');
            if(currentLang === 'AR') {
                loginTitle.innerText = 'تسجيل الدخول إلى مساحة عملك';
            } else {
                loginTitle.innerText = 'Log in to your workspace';
            }
        });

        // Demo login simulation
        function fillDemo(role) {
            const emailInput = document.querySelector('input[type="email"]');
            const passwordInput = document.querySelector('input[type="password"]');
            
            emailInput.value = `${role.toLowerCase()}@megawatt-erp.com`;
            passwordInput.value = 'password123';
            
            // Visual feedback
            const button = document.querySelector('button[type="submit"]');
            button.classList.add('bg-secondary-container', 'text-on-secondary-container');
            setTimeout(() => {
                button.classList.remove('bg-secondary-container', 'text-on-secondary-container');
            }, 300);
        }

        // Ripple-like interaction for demo chips
        document.querySelectorAll('.demo-chip').forEach(chip => {
            chip.addEventListener('click', function(e) {
                let ripple = document.createElement('div');
                ripple.classList.add('absolute', 'bg-white', 'opacity-20', 'rounded-full', 'animate-ping');
                ripple.style.width = '20px';
                ripple.style.height = '20px';
                this.appendChild(ripple);
                setTimeout(() => ripple.remove(), 500);
            });
        });
    </script>
</body></html>
